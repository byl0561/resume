<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色专业背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2C3040"/>
      <stop offset="100%" stop-color="#14181F"/>
    </linearGradient>
    <!-- 左上角细微高光 -->
    <radialGradient id="shine" cx="28%" cy="18%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- 裁剪至圆角矩形 -->
    <clipPath id="clip">
      <rect width="36" height="36" rx="8"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="36" height="36" rx="8" fill="url(#bg)"/>
  <!-- 高光层 -->
  <rect width="36" height="36" rx="8" fill="url(#shine)"/>
  <!-- 内描边 -->
  <rect width="36" height="36" rx="8" fill="none"
    stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- 人像剪影（裁剪到圆角矩形内） -->
  <g clip-path="url(#clip)" fill="rgba(255,255,255,0.92)">
    <!-- 头部 -->
    <circle cx="18" cy="13" r="6.5"/>
    <!-- 肩部 / 身体（贝塞尔曲线产生自然肩线） -->
    <path d="M 1,42 C 5,23 31,23 35,42 Z"/>
  </g>
</svg>
